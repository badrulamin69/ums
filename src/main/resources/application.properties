spring.application.name=smart-university

# ==================== Database ====================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_university}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# ==================== JPA ====================
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Never use ddl-auto — Flyway manages schema
spring.jpa.hibernate.ddl-auto=validate

# ==================== Flyway ====================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==================== Server ====================
server.port=${SERVER_PORT:8085}

# ==================== JWT ====================
jwt.secret=${JWT_SECRET:c21hcnQtdW5pdmVyc2l0eS1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW5zLTI1Ni1iaXRz}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ==================== Socket.IO ====================
socketio.port=${SOCKETIO_PORT:9090}
socketio.host=${SOCKETIO_HOST:0.0.0.0}

# ==================== SpringDoc OpenAPI ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==================== File Uploads ====================
image.upload.dir=${UPLOAD_DIR:${user.home}/smart-university/uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================== Email ====================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==================== SSLCommerz ====================
sslcommerz.store-id=${SSLCOMMERZ_STORE_ID:}
sslcommerz.store-password=${SSLCOMMERZ_STORE_PASSWORD:}
sslcommerz.sandbox=${SSLCOMMERZ_SANDBOX:true}

# ==================== Frontend ====================
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# ==================== Jackson ====================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ==================== Logging ====================
logging.level.com.smartuniversity=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO
